org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# :shared 用显式 dependsOn() 维护自定义源集层级（commonMain ← jvmSharedMain ← {androidMain, jvmMain}），
# 与 Kotlin 默认 hierarchy template 冲突（AS 装机警告 "Default Kotlin Hierarchy Template Not Applied Correctly"）。
# 三条边都在 shared/build.gradle.kts 里显式配置，关掉默认模板即可，不丢可见性。
kotlin.mpp.applyDefaultHierarchyTemplate=false

# 加快失败：连不上海外仓库时 20 秒超时，别无限等
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=20000

