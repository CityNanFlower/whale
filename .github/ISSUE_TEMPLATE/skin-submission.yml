name: 皮肤投稿
description: 投一套皮肤包（.whale-skin.json），审过后上架
title: "[皮肤] "
labels: ["皮肤投稿"]
body:
  - type: markdown
    attributes:
      value: |
        皮肤＝一份声明式 JSON（配色令牌 + 圆角 + 贴纸 + 字体槽），几 KB，直接贴进来就行。

        **最省事的投法**是在 App 里「我的 → 皮肤 → 投稿」——正文会自动带好整份规格。
        在网页投的话，把 `.whale-skin.json` 的内容原样贴进下面那个代码块。

        提交后几秒钟会有机器人回一条校验评论，告诉你还差什么。
  - type: input
    id: name
    attributes:
      label: 皮肤名称
      description: 界面上显示的名字，8 字内最好看（例：晨雾纸）。
    validations:
      required: true
  - type: input
    id: oneLiner
    attributes:
      label: 一句话（这套皮肤想营造什么感觉）
      description: 一句话就够，会上架成索引里的简介。
      placeholder: 旧打字机纸感，圆角大、配色克制
    validations:
      required: true
  - type: textarea
    id: pack
    attributes:
      label: 皮肤包 JSON
      description: 整份 `.whale-skin.json` 原文（含 light / dark / fonts / shape / motif）。在 App 里点「投稿」时会自动填好这一栏。
      render: json
      placeholder: |
        {
          "id": "dawn-paper",
          "name": "晨雾纸",
          "version": 1,
          "light": { "paper": "#F5F6F4", "accent": "#2E6BE6", "...": "..." },
          "dark": {},
          "fonts": { "ui": "serif", "chat": "serif", "meta": "notomono" },
          "shape": { "r1": 6, "r2": 12, "r3": 18, "shadow": "none" },
          "motif": "postmark"
        }
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 还想说的（可选）
      description: 灵感、适配哪套笔法、希望怎么介绍它……
    validations:
      required: false
  - type: checkboxes
    id: agree
    attributes:
      label: 合规确认
      options:
        - label: 配色是我自行设计的，或取自明确许可的来源
          required: true
        - label: 皮肤只含声明式数据：不执行脚本、不联网、不含任何个人隐私
          required: true
        - label: 若皮肤带字体，我会另附许可（只支持 OFL-1.1 等允许再分发的），且字体文件不进包
          required: true
